name: Backend CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: efmis
          POSTGRES_PASSWORD: efmis_dev_password
          POSTGRES_DB: efmis_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U efmis -d efmis_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DB_HOST: localhost
      TEST_DB_PORT: '5432'
      TEST_MINIO_ENDPOINT: localhost
      TEST_MINIO_PORT: '9000'
      MINIO_ACCESS_KEY: efmis-minio
      MINIO_SECRET_KEY: efmis_minio_ci_password
    steps:
      # File storage is MinIO only (no local fallback). GitHub service containers cannot pass the "server" command,
      # so MinIO runs as a plain container.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=efmis-minio -e MINIO_ROOT_PASSWORD=efmis_minio_ci_password \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/ready && exit 0; sleep 2; done; docker logs minio; exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # build also exports openapi.json: the committed API contract must match the code
      - run: npm run build
      - name: API contract is up to date
        run: git diff --exit-code openapi.json || (echo "::error::openapi.json is stale - run npm run build and commit it" && exit 1)
      # ratchet: lower the number as each roadmap phase documents its area; it may never go up
      - run: npm run openapi:check -- --max=205
      - run: npm run test:e2e
